<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantumRISC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0C0E;
    --bg-1:#0f1315;
    --bg-2:#15181b;
    --panel-border:#262C32;
    --text-0:#E6EEF2;
    --text-1:#9BA6AD;
    --cyan:#4FD9EC;
    --radius:8px;
    --sidebar-width:280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;}
  body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--bg-0); color:var(--text-0); overflow:hidden}

  /* Grid layout: fixed sidebar + content */
  .app{display:grid; grid-template-columns:var(--sidebar-width) 1fr; grid-template-rows:48px 1fr 28px; grid-template-areas:"toolbar toolbar" "sidebar main" "status status"; height:100dvh; width:100vw}

  .toolbar{grid-area:toolbar; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--bg-1); border-bottom:1px solid var(--panel-border); z-index:90}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .tbtn{width:34px;height:34px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text-1);cursor:pointer}

  /* Sidebar */
  .sidebar{grid-area:sidebar;background:var(--bg-1); border-right:1px solid var(--panel-border); position:relative; z-index:80; overflow-y:auto}
  .sidebar-inner{padding:14px}
  .sidebar-nav{display:flex;flex-direction:column;gap:6px}
  .nav-section-label{font-size:11px;color:var(--text-1);text-transform:uppercase;padding:10px 6px 6px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;color:var(--text-0);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
  .nav-item:hover{background:var(--bg-2)}
  .nav-item.active{color:var(--cyan)}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;fill:currentColor;opacity:0.9}
  .nav-item .label{display:block}

  /* Main content */
  .main{grid-area:main; overflow:auto; background:transparent; min-width:0}
  .main-inner{padding:22px}

  /* Status bar */
  .status{grid-area:status;background:var(--bg-1);border-top:1px solid var(--panel-border);display:flex;align-items:center;padding:0 16px;color:var(--text-1);font-size:13px}

  /* Responsive: allow sidebar to collapse only when user clicks */
  .app.collapsed{grid-template-columns:56px 1fr}
  .app.collapsed .nav-item .label{display:none}

  /* prevent accidental hiding by external CSS: strong selectors but no !important */
  .sidebar, .sidebar .sidebar-inner, .sidebar .sidebar-nav, .sidebar .nav-item, .sidebar .nav-item .label{visibility:visible; opacity:1}

  /* prevent horizontal overflow */
  :root, body, .app {overflow-x:hidden}
</style>
</head>
<body>
<div class="app" id="appRoot">
  <div class="toolbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="#0E1719"/></svg>
      <div>QuantumRISC <span style="font-weight:600;color:var(--text-1);font-size:12px;margin-left:8px">Studio</span></div>
    </div>
    <button id="sidebar-toggle" class="tbtn" title="Toggle sidebar">☰</button>
    <div style="flex:1"></div>
    <div style="color:var(--text-1);font-size:13px">CLOCK <span style="margin-left:8px;color:var(--text-0);font-family:monospace">2.4 GHz</span></div>
  </div>

  <!-- Static, production-ready sidebar (no JS reconstruction) -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Studio navigation">
    <div class="sidebar-inner">
      <div class="nav-section-label">Navigation</div>
      <div class="sidebar-nav" id="sidebarNav">
        <div class="nav-item" data-key="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg><div class="label">Dashboard</div></div>
        <div class="nav-item" data-key="pipeline"><svg viewBox="0 0 24 24"><path d="M4 7h16v2H4zM4 11h16v2H4zM4 15h16v2H4z"/></svg><div class="label">Pipeline</div></div>
        <div class="nav-item" data-key="registers"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg><div class="label">Registers</div></div>
        <div class="nav-item" data-key="memory"><svg viewBox="0 0 24 24"><path d="M5 4h14v4H5zM5 10h14v10H5z"/></svg><div class="label">Memory</div></div>
        <div class="nav-item" data-key="cache"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><div class="label">Cache</div></div>
        <div class="nav-item" data-key="waveforms"><svg viewBox="0 0 24 24"><path d="M3 12h3l3-6 3 12 3-8 3 6 3-6"/></svg><div class="label">Waveforms</div></div>
        <div class="nav-item" data-key="performance"><svg viewBox="0 0 24 24"><path d="M3 14h4v7H3zM10 7h4v14h-4zM17 11h4v10h-4z"/></svg><div class="label">Performance</div></div>
        <div class="nav-item" data-key="verification"><svg viewBox="0 0 24 24"><path d="M3 6h18v4H3zM3 12h18v6H3z"/></svg><div class="label">Verification</div></div>
        <div class="nav-item" data-key="fpga"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><div class="label">FPGA</div></div>
        <div class="nav-item" data-key="settings"><svg viewBox="0 0 24 24"><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M6.2 17.8l1.4-1.4M16.4 7.6l1.4-1.4"/></svg><div class="label">Settings</div></div>
      </div>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="main-inner">
      <h3 style="color:var(--text-1);text-transform:uppercase;font-size:11px;margin-bottom:6px">Overview</h3>
      <h1 style="font-size:22px;margin-bottom:8px">CPU Status Center</h1>
      <p style="color:var(--text-1);max-width:860px">Live architectural state of the QuantumRISC 5-stage in-order core.</p>
    </div>
  </main>

  <div class="status" id="status">Status: <strong style="margin-left:8px;color:var(--text-0)">Idle</strong></div>
</div>

<script>
// Minimal JS: toggle and resizer only. No mutation observers or auto-rebuild logic.
(function(){
  const app = document.getElementById('appRoot');
  const toggle = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  const resizer = document.createElement('div');
  resizer.style.position='fixed'; resizer.style.top='48px'; resizer.style.bottom='28px'; resizer.style.left='calc(var(--sidebar-width) - 6px)'; resizer.style.width='12px'; resizer.style.cursor='col-resize'; resizer.style.zIndex='85'; resizer.id='sidebarResizer';
  document.body.appendChild(resizer);

  toggle.addEventListener('click', ()=>{ app.classList.toggle('collapsed'); });

  // simple drag to resize (clamped)
  let dragging=false; const min=160, max=520;
  resizer.addEventListener('mousedown', ()=>{ dragging=true; document.body.style.userSelect='none'; });
  window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect='auto'; });
  window.addEventListener('mousemove', (e)=>{ if(!dragging) return; const w = Math.min(max, Math.max(min, e.clientX)); app.style.setProperty('--sidebar-width', w+'px'); resizer.style.left = (w - 6) + 'px'; });

  // ensure nav count present on load; defensive check but not rebuilding
  window.addEventListener('load', ()=>{
    const items = document.querySelectorAll('.sidebar .nav-item');
    if(items.length < 10){ console.warn('Sidebar nav missing items:', items.length); }
  });
})();
</script>
</body>
</html>
