<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantumRISC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0C0E;
    --bg-1:#111417;
    --bg-2:#171B1F;
    --bg-3:#1E2328;
    --panel-border:#262C32;
    --panel-border-soft:#1D2226;
    --text-0:#F1F3F5;
    --text-1:#AEB6BE;
    --text-2:#6B747C;
    --cyan:#4FD9EC;
    --cyan-dim:rgba(79,217,236,0.14);
    --green:#33D488;
    --green-dim:rgba(51,212,136,0.14);
    --radius:6px;
    --sidebar-width:280px; /* enforced wider default */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-0);
    color:var(--text-0);
    font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:13px;
    overflow:hidden;
  }

  /* Strong visibility rules to prevent the sidebar being hidden by external CSS/scripts */
  .sidebar,
  .sidebar *,
  .nav-item,
  .nav-item .label,
  .nav-section-label {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }

  .app{
    display:grid;
    grid-template-rows:44px 1fr 26px;
    grid-template-columns:var(--sidebar-width) 1fr; /* enforce left rail */
    grid-template-areas:
      "toolbar toolbar"
      "sidebar main"
      "status status";
    height:100dvh;
    width:100vw;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size:32px 32px;
  }

  .toolbar{grid-area:toolbar; display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--bg-1); border-bottom:1px solid var(--panel-border-soft); z-index:90;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; color:var(--text-0); padding-right:14px; border-right:1px solid var(--panel-border-soft); height:100%;}
  .tbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--text-1);cursor:pointer;}
  .tbtn:hover{background:var(--bg-3);color:var(--text-0);}

  /* Sidebar enforced high z-index so overlays don't cover it */
  .sidebar{grid-area:sidebar;background:var(--bg-1);border-right:1px solid var(--panel-border-soft);overflow-y:auto;padding:12px;transition:width .12s ease;position:relative;z-index:80;width:var(--sidebar-width) !important;}
  .nav-section-label{font-size:9.5px;color:var(--text-2);text-transform:uppercase;font-weight:600;padding:8px 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;color:var(--text-0);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:1}
  .nav-item:hover{background:var(--bg-2);}
  .nav-item.active{color:var(--cyan)}
  .nav-item .label{display:block}

  .main{grid-area:main; overflow:auto; position:relative; background:var(--bg-0); min-width:0;}
  .status{grid-area:status;background:var(--bg-1);border-top:1px solid var(--panel-border-soft);display:flex;align-items:center;padding:0 14px;font-size:10.5px;color:var(--text-2);}

  /* Responsive: allow collapse on small screens (but desktop forced visible via media query above) */
  @media (max-width:980px){ .app{ --sidebar-width:120px; } .sidebar{ padding:8px 6px; } }
</style>
</head>
<body>
<div class="app" id="appRoot">
  <div class="toolbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="3" fill="#0F1720"/></svg>
      <div>QuantumRISC <small style="display:block;color:var(--text-2);font-size:9px;">Studio</small></div>
    </div>
    <div class="tool-group"><button id="sidebar-toggle" class="tbtn" title="Toggle sidebar">☰</button></div>
    <div style="flex:1"></div>
  </div>

  <!-- Sidebar: mark with role and data attributes; include full nav items inline so DOM always contains them -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="nav-section-label">Navigation</div>
    <div class="nav-list" id="navList">
      <div class="nav-item" data-nav="overview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg><div class="label">Dashboard</div></div>
      <div class="nav-item" data-nav="pipeline"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><div class="label">Pipeline</div></div>
      <div class="nav-item" data-nav="registers"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg><div class="label">Registers</div></div>
      <div class="nav-item" data-nav="memory"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg><div class="label">Memory</div></div>
      <div class="nav-item" data-nav="cache"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><div class="label">Cache</div></div>
      <div class="nav-item" data-nav="waveforms"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><div class="label">Waveforms</div></div>
      <div class="nav-item" data-nav="performance"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg><div class="label">Performance</div></div>
      <div class="nav-item" data-nav="verification"><svg viewBox="0 0 24 24"><path d="M4 4h16v4H4z"/></svg><div class="label">Verification</div></div>
      <div class="nav-item" data-nav="fpga"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><div class="label">FPGA</div></div>
      <div class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M12 3v18"/></svg><div class="label">Settings</div></div>
    </div>
  </nav>

  <main class="main" id="main">
    <div style="padding:24px;">
      <h2 style="margin-bottom:8px;color:var(--cyan);font-size:12px;text-transform:uppercase;">Overview</h2>
      <h1 style="font-size:22px;margin-bottom:6px;">CPU Status Center</h1>
      <p style="color:var(--text-2);max-width:70%">Live architectural state of the QuantumRISC 5-stage in-order core.</p>
    </div>
  </main>

  <div class="status" id="status">Status: <strong style="margin-left:8px;color:var(--text-0)">Idle</strong></div>
</div>

<script>
// Robustness script: ensure nav exists and restore if removed by third-party scripts
(function(){
  const sidebar = document.getElementById('sidebar');
  const navList = document.getElementById('navList');
  const toggle = document.getElementById('sidebar-toggle');
  const app = document.getElementById('appRoot');

  // Template of nav items (kept in JS so we can restore if anything removes them)
  const navTemplate = [
    {key:'overview', label:'Dashboard'},
    {key:'pipeline', label:'Pipeline'},
    {key:'registers', label:'Registers'},
    {key:'memory', label:'Memory'},
    {key:'cache', label:'Cache'},
    {key:'waveforms', label:'Waveforms'},
    {key:'performance', label:'Performance'},
    {key:'verification', label:'Verification'},
    {key:'fpga', label:'FPGA'},
    {key:'settings', label:'Settings'},
  ];

  function buildNavItem(def){
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.setAttribute('data-nav', def.key);
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('width','18'); svg.setAttribute('height','18');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect'); rect.setAttribute('x','3'); rect.setAttribute('y','3'); rect.setAttribute('width','18'); rect.setAttribute('height','18'); rect.setAttribute('rx','2'); rect.setAttribute('fill','none');
    // use simple circle for uniqueness for overview
    if(def.key==='overview'){
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','10'); c.setAttribute('fill','currentColor'); svg.appendChild(c);
    } else {
      svg.appendChild(rect);
    }
    const label = document.createElement('div'); label.className = 'label'; label.textContent = def.label;
    item.appendChild(svg);
    item.appendChild(label);
    // click handler: mark active
    item.addEventListener('click', ()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); item.classList.add('active'); });
    return item;
  }

  function restoreNavIfMissing(){
    if(!navList) return; // nothing we can do
    // If there are no nav-item children or fewer than expected, rebuild
    const items = navList.querySelectorAll('.nav-item');
    if(items.length < navTemplate.length){
      // clear and rebuild
      navList.innerHTML = '';
      for(const def of navTemplate){ navList.appendChild(buildNavItem(def)); }
      console.info('[Studio] Sidebar navigation restored');
    }
  }

  // Run once on load
  document.addEventListener('DOMContentLoaded', ()=>{
    // ensure not collapsed by third-party script
    app.classList.remove('collapsed');
    restoreNavIfMissing();
  });

  // Observe mutations on sidebar and restore if nav items are removed
  const mo = new MutationObserver((records)=>{
    for(const r of records){
      if(r.type==='childList'){
        // if navList lost children, restore
        if(!navList.querySelector('.nav-item')){ restoreNavIfMissing(); }
      }
    }
  });
  mo.observe(sidebar, { childList:true, subtree:true });

  // Also periodic sanity check in case of aggressive scripts
  setInterval(restoreNavIfMissing, 2000);

  // Toggle collapse behavior: only user toggle should collapse
  toggle.addEventListener('click', ()=>{ app.classList.toggle('collapsed'); });

  // Prevent accidental external styles from hiding labels: re-apply inline styles
  function enforceInlineStyles(){ document.querySelectorAll('.nav-item .label').forEach(el=>{ el.style.display='block'; el.style.visibility='visible'; el.style.opacity='1'; }); }
  setInterval(enforceInlineStyles, 1500);
})();
</script>
</body>
</html>
