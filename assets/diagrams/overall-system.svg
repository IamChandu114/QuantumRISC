<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#05070b'/>
      <stop offset='100%' stop-color='#0b1220'/>
    </linearGradient>
    <linearGradient id='cyan' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#00d4ff'/>
      <stop offset='100%' stop-color='#00ff88'/>
    </linearGradient>
    <filter id='glow'><feGaussianBlur stdDeviation='6' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'><path d='M 40 0 L 0 0 0 40' fill='none' stroke='rgba(255,255,255,0.04)' stroke-width='1'/></pattern>
  </defs>
  <rect width='1280' height='720' fill='url(#bg)'/>
  <rect width='1280' height='720' fill='url(#grid)'/>
  <circle cx='960' cy='140' r='220' fill='rgba(0,212,255,0.08)' filter='url(#glow)'/>
  <circle cx='280' cy='560' r='260' fill='rgba(0,255,136,0.04)' filter='url(#glow)'/>
  <text x='72' y='96' fill='#00d4ff' font-family='Inter,Segoe UI,sans-serif' font-size='18' letter-spacing='4'>QUANTUMRISC / RELEASE ARTIFACT</text>
  <text x='72' y='156' fill='#ffffff' font-family='Inter,Segoe UI,sans-serif' font-size='52' font-weight='700'>Overall System Architecture</text>
  <text x='72' y='202' fill='#98a2b3' font-family='Inter,Segoe UI,sans-serif' font-size='24'>Website, Studio, FastAPI backend, RTL, simulation, VCD parsing, and live visualization in one loop.</text>
    <g font-family='Inter,Segoe UI,sans-serif' font-size='18'>
    <rect x='72' y='260' width='216' height='110' rx='18' fill='rgba(0,212,255,0.08)' stroke='rgba(0,212,255,0.5)'/>
    <text x='180' y='306' text-anchor='middle' fill='#00d4ff' font-weight='700'>Website</text>
    <text x='180' y='336' text-anchor='middle' fill='#9fb3c8' font-size='14'>Public landing page</text>
    <rect x='332' y='260' width='216' height='110' rx='18' fill='rgba(0,255,136,0.08)' stroke='rgba(0,255,136,0.5)'/>
    <text x='440' y='306' text-anchor='middle' fill='#00ff88' font-weight='700'>Studio</text>
    <text x='440' y='336' text-anchor='middle' fill='#9fb3c8' font-size='14'>Interactive engineering UI</text>
    <rect x='592' y='260' width='216' height='110' rx='18' fill='rgba(200,121,65,0.08)' stroke='rgba(200,121,65,0.5)'/>
    <text x='700' y='306' text-anchor='middle' fill='#c87941' font-weight='700'>FastAPI</text>
    <text x='700' y='336' text-anchor='middle' fill='#9fb3c8' font-size='14'>Session and simulation backend</text>
    <rect x='852' y='260' width='216' height='110' rx='18' fill='rgba(255,153,0,0.08)' stroke='rgba(255,153,0,0.5)'/>
    <text x='960' y='306' text-anchor='middle' fill='#ff9900' font-weight='700'>RTL + VCD</text>
    <text x='960' y='336' text-anchor='middle' fill='#9fb3c8' font-size='14'>Icarus Verilog simulation</text>
    <line x1='288' y1='315' x2='332' y2='315' stroke='url(#cyan)' stroke-width='3'/>
    <line x1='548' y1='315' x2='592' y2='315' stroke='url(#cyan)' stroke-width='3'/>
    <line x1='808' y1='315' x2='852' y2='315' stroke='url(#cyan)' stroke-width='3'/>
    <text x='640' y='430' text-anchor='middle' fill='#6b7788' font-family='JetBrains Mono,Consolas,monospace' font-size='14'>Real data flows left to right and back through WebSocket updates.</text>
  </g>
  <rect x='72' y='620' width='1136' height='1' fill='rgba(255,255,255,0.08)'/>
  <text x='72' y='662' fill='#5f6b7a' font-family='JetBrains Mono,Consolas,monospace' font-size='14'>QuantumRISC · production release media</text>
</svg>
