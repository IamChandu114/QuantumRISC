<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#05070b'/>
      <stop offset='100%' stop-color='#0b1220'/>
    </linearGradient>
    <linearGradient id='cyan' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#00d4ff'/>
      <stop offset='100%' stop-color='#00ff88'/>
    </linearGradient>
    <filter id='glow'><feGaussianBlur stdDeviation='6' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'><path d='M 40 0 L 0 0 0 40' fill='none' stroke='rgba(255,255,255,0.04)' stroke-width='1'/></pattern>
  </defs>
  <rect width='1280' height='720' fill='url(#bg)'/>
  <rect width='1280' height='720' fill='url(#grid)'/>
  <circle cx='960' cy='140' r='220' fill='rgba(0,212,255,0.08)' filter='url(#glow)'/>
  <circle cx='280' cy='560' r='260' fill='rgba(0,255,136,0.04)' filter='url(#glow)'/>
  <text x='72' y='96' fill='#00d4ff' font-family='Inter,Segoe UI,sans-serif' font-size='18' letter-spacing='4'>QUANTUMRISC / RELEASE ARTIFACT</text>
  <text x='72' y='156' fill='#ffffff' font-family='Inter,Segoe UI,sans-serif' font-size='52' font-weight='700'>Simulation Flow</text>
  <text x='72' y='202' fill='#98a2b3' font-family='Inter,Segoe UI,sans-serif' font-size='24'>Compile, run, VCD generation, parse, stream, and visualize.</text>
    <g font-family='Inter,Segoe UI,sans-serif'>
    <rect x='92' y='286' width='164' height='72' rx='16' fill='rgba(0,212,255,0.08)' stroke='rgba(0,212,255,0.45)'/><text x='174' y='329' text-anchor='middle' fill='#00d4ff' font-size='18' font-weight='700'>Compile</text>
    <rect x='286' y='286' width='164' height='72' rx='16' fill='rgba(0,255,136,0.08)' stroke='rgba(0,255,136,0.45)'/><text x='368' y='329' text-anchor='middle' fill='#00ff88' font-size='18' font-weight='700'>Run VVP</text>
    <rect x='480' y='286' width='164' height='72' rx='16' fill='rgba(255,153,0,0.08)' stroke='rgba(255,153,0,0.45)'/><text x='562' y='329' text-anchor='middle' fill='#ff9900' font-size='18' font-weight='700'>Emit VCD</text>
    <rect x='674' y='286' width='164' height='72' rx='16' fill='rgba(255,51,102,0.08)' stroke='rgba(255,51,102,0.45)'/><text x='756' y='329' text-anchor='middle' fill='#ff3366' font-size='18' font-weight='700'>Parse</text>
    <rect x='868' y='286' width='164' height='72' rx='16' fill='rgba(200,121,65,0.08)' stroke='rgba(200,121,65,0.45)'/><text x='950' y='329' text-anchor='middle' fill='#c87941' font-size='18' font-weight='700'>Stream UI</text>
    <path d='M256 322 L286 322 M450 322 L480 322 M644 322 L674 322 M838 322 L868 322' stroke='url(#cyan)' stroke-width='3'/>
    <text x='562' y='430' text-anchor='middle' fill='#6b7788' font-family='JetBrains Mono,Consolas,monospace' font-size='14'>The backend turns a simulation run into live architectural state.</text>
  </g>
  <rect x='72' y='620' width='1136' height='1' fill='rgba(255,255,255,0.08)'/>
  <text x='72' y='662' fill='#5f6b7a' font-family='JetBrains Mono,Consolas,monospace' font-size='14'>QuantumRISC · production release media</text>
